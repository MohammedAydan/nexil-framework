<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nexil / Astro comparison specimen</title>
    <meta name="description" content="Equivalent server-rendered counter specimen." />
    <meta property="og:title" content="Nexil / Astro comparison specimen" />
    <meta property="og:description" content="Equivalent server-rendered counter specimen." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <main>
      <h1>HTML-first comparison specimen</h1>
      <p>Server-rendered content with one interactive counter island.</p>
      <img src="/nexil-showcase.svg" width="640" height="360" alt="Cyan signal wave" />
      <astro-island
        component-url="./Counter.js"
        renderer-url="./astro-island.js"
        props='{"count":0}'
        client="load"
      >
        <button id="counter" type="button">Count: 0</button>
      </astro-island>
    </main>
    <script type="module" src="./astro-island.js"></script>
  </body>
</html>
