name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for E2E
        run: pnpm exec playwright install --with-deps chromium

      - name: Build workspace
        run: pnpm build

      - name: npm dry run
        run: pnpm publish:npm:dry

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Unit and integration tests
        run: pnpm test

      - name: Real-browser E2E
        run: pnpm test:e2e

      - name: Node runtime smoke
        run: pnpm test:node-runtime

      - name: Miniflare workerd smoke
        run: pnpm test:edge

      - name: Deno runtime smoke
        run: pnpm test:deno

      - name: Deno runtime spec
        run: pnpm test:deno:e2e

      - name: Dependency audit
        run: pnpm security

      - name: Reject committed secrets and generated artifacts
        run: |
          ! git grep -nE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,})' -- ':!pnpm-lock.yaml'
          test -z "$(git ls-files | grep -E '(^|/)(dist|coverage|node_modules)/' || true)"
