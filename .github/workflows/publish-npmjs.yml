name: Publish to npmjs

# Immediate publish: as soon as code is pushed to main, build and publish
# all public packages to https://registry.npmjs.org in dependency order.
# Also available via manual dispatch. Keeps the tag-driven workflow
# (publish-packages.yml) for versioned releases; this workflow is for
# continuous delivery on main.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-npmjs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-npmjs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only publish from the canonical repository; forks can still run the build
    # but the publish step will be skipped without NPM_TOKEN.
    if: github.repository == 'MohammedAydan/nexil-framework'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Validate packed tarballs (dry run)
        run: |
          pnpm publish:npm:dry > pack-report.log 2>&1 || { cat pack-report.log; exit 1; }
          sed -i 's/\x1b\[[0-9;]*m//g' pack-report.log
          MATCHED=$(grep -cE '^\+ @nexil/' pack-report.log || true)
          echo "Packages matched: $MATCHED"
          # Require at least one public package; the full 20+ check is in the tag-driven workflow
          if [ "$MATCHED" -lt 1 ]; then
            echo '::error::Dry run matched no packages — aborting'
            tail -n 80 pack-report.log
            exit 1
          fi
          if grep -q 'workspace:' pack-report.log; then
            echo '::error::Unresolved workspace:* leaked into tarball'
            exit 1
          fi
          if grep -Eq 'notice .*(test\.js|test\.d\.ts)' pack-report.log; then
            echo '::error::Test artifacts leaked into tarball'
            grep -E 'notice .*(test\.js|test\.d\.ts)' pack-report.log
            exit 1
          fi

      - name: Auto-bump patch if version already exists on npmjs
        # For continuous delivery on main, ensure we never try to republish
        # an existing version. If @nexil/core@0.0.1 already exists, bump to
        # 0.0.2 (and repeat until free) so `pnpm publish` actually uploads.
        # Uses node to edit package.json directly to avoid `npm version`
        # failing on `workspace:*` dependencies.
        run: |
          for dir in packages/*; do
            [ -f "$dir/package.json" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            # skip private packages (e.g. create-nexil-app)
            if node -e "const p=require('./$dir/package.json'); process.exit(p.private ? 0 : 1)"; then
              echo "skip private $name"
              continue
            fi
            ver=$(node -p "require('./$dir/package.json').version")
            # loop until version is free on npmjs
            while npm view "$name@$ver" version --registry https://registry.npmjs.org >/dev/null 2>&1; do
              echo "Version $ver already exists for $name, bumping patch"
              node -e "const fs=require('fs'); const f='./$dir/package.json'; const p=require('./'+f); const v=p.version.split('.').map(Number); v[2]=(v[2]||0)+1; p.version=v.join('.'); fs.writeFileSync(f, JSON.stringify(p,null,2)+'\n')"
              ver=$(node -p "require('./$dir/package.json').version")
              echo " -> new version for $name: $ver"
            done
          done
          echo "Final versions to publish:"
          for dir in packages/*; do
            [ -f "$dir/package.json" ] && echo " - $(node -p "require('./$dir/package.json').name")@$(node -p "require('./$dir/package.json').version")"
          done

      - name: Configure npm authentication
        run: |
          {
            echo "@nexil:registry=https://registry.npmjs.org"
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
          } > "$RUNNER_TEMP/publish.npmrc"
          echo "Wrote $RUNNER_TEMP/publish.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish public packages to npmjs (dependency order)
        run: |
          set -o pipefail
          pnpm publish:npm 2>&1 | tee publish.log
          EXIT=${PIPESTATUS[0]}
          echo "Publish exit: $EXIT"
          cat publish.log
          exit $EXIT
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/publish.npmrc
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify initializer is resolvable
        run: npm view @nexil/create-nexil version --registry=https://registry.npmjs.org || echo "verify skipped (not yet published or network issue)"
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/publish.npmrc
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
