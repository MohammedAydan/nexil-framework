name: Publish to npmjs
# Immediate publish on push to main (and manual dispatch).
# Versions come ONLY from package.json in the repo.
# If the exact version is already published, only the patch is bumped until free.
# Keeps the tag-driven workflow (publish-packages.yml) for versioned releases.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: publish-npmjs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-npmjs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'MohammedAydan/nexil-framework'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Respect package.json versions. Only bump the patch if *this exact*
      # version is already published (so we never re-publish the same number).
      # Does NOT look at the highest published version and invent a new one.
      - name: Auto-bump patch only if exact version already exists
        run: |
          for dir in packages/*; do
            [ -f "$dir/package.json" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            if node -e "const p=require('./$dir/package.json'); process.exit(p.private ? 0 : 1)"; then
              echo "skip private $name"
              continue
            fi
            ver=$(node -p "require('./$dir/package.json').version")
            while npm view "$name@$ver" version --registry https://registry.npmjs.org >/dev/null 2>&1; do
              echo "Version $ver already exists for $name, bumping patch"
              node -e "
                const fs = require('fs');
                const f = './$dir/package.json';
                const p = require(f);
                const v = p.version.split('.').map(Number);
                v[2] = (v[2] || 0) + 1;
                p.version = v.join('.');
                fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
              "
              ver=$(node -p "require('./$dir/package.json').version")
              echo " -> new version for $name: $ver"
            done
          done
          echo "Final versions to publish (from package.json + any necessary patch bumps):"
          for dir in packages/*; do
            [ -f "$dir/package.json" ] && echo " - $(node -p "require('./$dir/package.json').name")@$(node -p "require('./$dir/package.json').version")"
          done

      - name: Build workspace
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Validate packed tarballs (dry run)
        run: |
          pnpm publish:npm:dry > pack-report.log 2>&1 || { cat pack-report.log; exit 1; }
          sed -i 's/\x1b\[[0-9;]*m//g' pack-report.log
          MATCHED=$(grep -cE '^\+ @nexil/' pack-report.log || true)
          echo "Packages matched: $MATCHED"
          if [ "$MATCHED" -lt 1 ]; then
            echo '::error::Dry run matched no packages — aborting'
            tail -n 80 pack-report.log
            exit 1
          fi
          if grep -q 'workspace:' pack-report.log; then
            echo '::error::Unresolved workspace:* leaked into tarball'
            exit 1
          fi
          if grep -Eq 'notice .*(test\.js|test\.d\.ts)' pack-report.log; then
            echo '::error::Test artifacts leaked into tarball'
            grep -E 'notice .*(test\.js|test\.d\.ts)' pack-report.log
            exit 1
          fi

      - name: Configure npm authentication
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          echo "@nexil:registry=https://registry.npmjs.org" >> ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Critical fix: default shell is bash -e (no pipefail).
      # Without set -o pipefail, `pnpm ... | tee` always reports success
      # because tee exits 0 even when pnpm fails with E403.
      - name: Publish public packages to npmjs (dependency order)
        run: |
          set -o pipefail
          pnpm -r publish --access public --no-git-checks --no-provenance 2>&1 | tee publish.log
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_USERCONFIG: ~/.npmrc

      # Always surface real publish failures (especially the 2FA case)
      # so the job never looks successful when nothing was published.
      - name: Fail loudly on any publish error
        if: always()
        run: |
          if [ ! -f publish.log ]; then
            echo "::error::publish.log was not created"
            exit 1
          fi
          if grep -qE 'npm error|E403|E401|EOTP' publish.log; then
            echo "::error::One or more packages failed to publish:"
            grep -E 'npm error|E403|E401|EOTP' publish.log || true
            if grep -q 'Two-factor authentication or granular access token' publish.log; then
              echo "::error::NPM_TOKEN lacks 2FA-bypass permission."
              echo "::error::Regenerate it on npmjs.com as either:"
              echo "::error::  - Granular Access Token with 'Bypass two-factor authentication' enabled, or"
              echo "::error::  - classic Automation token (bypasses 2FA by default)"
              echo "::error::Give it Read and Write on the @nexil scope, then update the GitHub secret NPM_TOKEN."
            fi
            exit 1
          fi
          echo "No publish errors detected in publish.log"

      - name: Verify published versions are live on the registry
        if: success()
        run: |
          echo "Checking that the versions from package.json are actually on the registry..."
          for dir in packages/*; do
            [ -f "$dir/package.json" ] || continue
            name=$(node -p "require('./$dir/package.json').name")
            ver=$(node -p "require('./$dir/package.json').version")
            if node -e "const p=require('./$dir/package.json'); process.exit(p.private ? 0 : 1)"; then
              continue
            fi
            ok=false
            for i in 1 2 3 4 5; do
              if npm view "$name@$ver" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
                ok=true
                break
              fi
              sleep 3
            done
            if [ "$ok" = true ]; then
              echo "✔ $name@$ver"
            else
              echo "✘ $name@$ver not found on registry"
              echo "::error::$name@$ver is not live on the registry"
              exit 1
            fi
          done
