name: Publish packages

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Configure GitHub Packages scope
        run: |
          {
            echo "@mohammedaydan:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}"
          } > "$NPM_CONFIG_USERCONFIG"
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/.npmrc
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish framework packages
        run: pnpm publish --recursive --filter "./packages/*" --no-git-checks --access public
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/.npmrc
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
