name: Publish packages

# Releases are deliberate and tag-driven: push a `v<version>` tag (e.g. v0.1.2)
# after updating package versions. Every push of a new tag runs the full gate
# suite, validates the packed tarballs, then publishes all non-private packages
# under packages/* to npm (https://registry.npmjs.org/) in dependency-safe (topological) order.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit and integration tests
        run: pnpm test

      - name: Validate packed tarballs (dry run)
        run: |
          pnpm publish:npm:dry > pack-report.log 2>&1 || { cat pack-report.log; exit 1; }
          sed -i 's/\x1b\[[0-9;]*m//g' pack-report.log
          MATCHED=$(grep -cE '^\+ (@nexil/core@|@nexil/vite-plugin@|@nexil/cli@|create-nexil@)' pack-report.log || true)
          echo "Packages matched: $MATCHED"
          for pkg in "@nexil/core@" "@nexil/vite-plugin@" "@nexil/cli@" "create-nexil@"; do
            if ! grep -qE "^\+\s*${pkg}" pack-report.log; then
              echo "::error::Expected package ${pkg} not found in dry-run output"
              tail -n 80 pack-report.log
              exit 1
            fi
          done
          if [ "$MATCHED" -ne 4 ]; then
            echo "::error::Dry run matched $MATCHED packages, expected exactly 4 (@nexil/core, @nexil/vite-plugin, @nexil/cli, create-nexil) — aborting release"
            tail -n 40 pack-report.log
            exit 1
          fi
          if ! grep -Eq '^\+\s*(@nexil/core@0\.1\.0|@nexil/vite-plugin@0\.1\.0|@nexil/cli@0\.1\.0|create-nexil@0\.1\.0)' pack-report.log; then
            echo "::error::One or more packages not at expected version 0.1.0"
            grep -E '^\+\s*(@nexil/|create-nexil)' pack-report.log || true
            exit 1
          fi
          if grep -q 'workspace:' pack-report.log; then
            echo '::error::Unresolved workspace dependency leaked into a tarball manifest'
            exit 1
          fi
          if grep -Eq 'notice .*(test\.js|test\.d\.ts)' pack-report.log; then
            echo '::error::Test artifacts leaked into a tarball'
            grep -E 'notice .*(test\.js|test\.d\.ts)' pack-report.log
            exit 1
          fi
          # Verify expected dist artifacts are present in tarball contents
          if ! grep -q 'dist/index\.d\.ts' pack-report.log; then
            echo "::error::Missing dist/index.d.ts in tarball contents"
            exit 1
          fi
          if ! grep -q 'dist/index\.js' pack-report.log; then
            echo "::error::Missing dist/index.js in tarball contents"
            exit 1
          fi
          if ! grep -q 'dist/bin\.js' pack-report.log; then
            echo "::error::Missing dist/bin.js in tarball contents"
            exit 1
          fi

      # Isolated npm config keeps credentials out of the workspace and out of logs.
      - name: Configure npm authentication
        run: |
          {
            echo "@nexil:registry=https://registry.npmjs.org"
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
          } > "$RUNNER_TEMP/publish.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish public packages (dependency order)
        run: pnpm publish:npm
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/publish.npmrc
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify initializer is resolvable
        run: npm view create-nexil version --registry=https://registry.npmjs.org
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/publish.npmrc
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
